name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ToDo.apk
          ls -la ToDo.apk

      - name: Keep APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: ToDo-apk
          path: ToDo.apk

      - name: Publish as latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Eric's To-Do (version ${{ github.run_number }})"
          body: "Open this page on your phone and tap **ToDo.apk** to install or update. Version ${{ github.run_number }}."
          files: ToDo.apk
          make_latest: true
